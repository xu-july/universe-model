    <style>
        body { margin: 0; overflow: hidden; background-color: #030304 !important; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; }
        
        button, input, .pointer-events-auto { pointer-events: auto; touch-action: manipulation; }
        
        .glass-panel { background: rgba(10, 15, 25, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        
        input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #eab308; cursor: pointer; margin-top: -7px; box-shadow: 0 0 15px rgba(234,179,8,0.8); border: 2px solid white; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
        
        .epic-btn { background: linear-gradient(135deg, #4f46e5 0%, #db2777 100%); border: none; transition: transform 0.2s, box-shadow 0.2s; }
        .epic-btn:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(219,39,119,0.5); }
        .active-mode { box-shadow: 0 0 0 2px #fff, 0 0 20px #db2777 !important; filter: brightness(1.2); }
        
        #teacher-tooltip { transition: opacity 0.4s, transform 0.4s; }
        .tooltip-hidden { opacity: 0; transform: translateY(-20px) translateX(-50%); pointer-events: none; }
        
        .card-transition { transition: opacity 0.3s, transform 0.3s; }
        .card-hidden { opacity: 0; transform: translateY(-50%) translateX(30px); pointer-events: none; }

        .cam-btn { transition: all 0.3s; }
        .cam-btn.active { border-color: #3b82f6; color: #93c5fd; background-color: rgba(59, 130, 246, 0.2); box-shadow: 0 0 10px rgba(59,130,246,0.3) inset; }
        
        @keyframes pulse-glow { 0% { box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); } 50% { box-shadow: 0 0 20px rgba(234, 179, 8, 0.8); } 100% { box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); } }
        .planet-btn-active { animation: pulse-glow 2s infinite; border-color: #eab308 !important; color: #fde047 !important; background: rgba(161, 98, 7, 0.3) !important; }

        #left-panel-wrapper { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform; }

        @keyframes toast-slide-up { 0% { opacity: 0; transform: translateY(20px) translateX(20px); } 10% { opacity: 1; transform: translateY(0) translateX(0); } 90% { opacity: 1; transform: translateY(0) translateX(0); } 100% { opacity: 0; transform: translateY(-20px) translateX(0); } }
        .toast-anim { animation: toast-slide-up 4.5s forwards; }
        .cursor-meteor { cursor: crosshair !important; }

        /* AI 面板样式 */
        #ai-panel { transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #ai-panel.open { transform: translateX(0); }
        .chat-bubble-user { background: rgba(59, 130, 246, 0.8); border-radius: 12px 12px 0 12px; margin-left: auto; max-width: 90%; word-break: break-word;}
        .chat-bubble-ai { background: rgba(20, 184, 166, 0.8); border-radius: 12px 12px 12px 0; margin-right: auto; max-width: 90%; word-break: break-word;}
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; width: 6px; height: 6px; border-radius: 50%; background-color: white; display: inline-block; margin: 0 2px;}
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        /* 麦克风录音闪烁动画 */
        .mic-recording { animation: pulse-red 1.5s infinite; background-color: #ef4444 !important; border-color: #f87171 !important;}
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>

    <script>
        // 🚀 配置国内 iFlow API
        const apiKey = "sk-b07db828818e4d68c480a6f1ade257b8"; 
        
        // 🤖 AI Helper Logic
        const aiPanel = document.getElementById('ai-panel');
        const btnOpenAI = document.getElementById('btn-open-ai');
        const btnCloseAI = document.getElementById('btn-close-ai');
        const btnAiSend = document.getElementById('btn-ai-send');
        const btnAiAnalyze = document.getElementById('btn-ai-analyze');
        const btnAiMic = document.getElementById('btn-ai-mic'); // 🎤 麦克风按钮
        const btnAiStopVoice = document.getElementById('btn-ai-stop-voice'); // 🛑 停止语音按钮
        const aiInput = document.getElementById('ai-input');
        const chatHistory = document.getElementById('chat-history');

        let isAIOpen = false;

        // 💡 尽早触发浏览器加载语音包（解决首次加载无声音的问题）
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // 🔊 TTS (文本转语音) 功能模块
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                btnAiStopVoice.classList.add('hidden'); // 重置停止按钮状态

                // 过滤掉 Markdown 符号，让语音读起来更自然
                const cleanText = text.replace(/[*#_`~-]/g, '').replace(/\n/g, '，');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'zh-CN';
                utterance.rate = 1.05; 
                
                // 🚀 寻找 Edge 浏览器中的高级“拟人”语音 (Neural Voices)
                const voices = window.speechSynthesis.getVoices();

        document.getElementById('btn-toggle-polars').addEventListener('click', () => { showPolars = !showPolars; northPolarLine.visible = showPolars; southPolarLine.visible = showPolars; toggleBtnState('btn-toggle-polars', showPolars, 'cyan'); });

        document.getElementById('btn-sunlight').addEventListener('click', function() {

            if(isShowSunlight) { this.classList.replace('bg-yellow-900/50', 'bg-yellow-700'); status.innerText = "已开启"; status.className = "bg-yellow-500 text-black font-bold px-1 rounded text-[10px]"; }

        document.getElementById('btn-subsolar').addEventListener('click', function() {
            isShowSubsolar = !isShowSubsolar; subsolarMarker.visible = isShowSubsolar; heatmapMesh.visible = isShowSubsolar; 
            if(isShowSubsolar) {
                this.className = "w-full bg-red-900 hover:bg-red-800 border border-red-500 text-red-100 font-bold py-2 px-3 rounded-lg text-xs transition flex justify-center items-center gap-2 mt-auto cursor-pointer shadow-[0_4px_15px_rgba(220,38,38,0.5)]";

        const _ePos = new THREE.Vector3(); const _mLocalPos = new THREE.Vector3(); const _mWorldPos = new THREE.Vector3();
        const _dirS2E = new THREE.Vector3(); const _dirE2M = new THREE.Vector3(); const _dirS2M = new THREE.Vector3(); const _dirM2E = new THREE.Vector3();
        const _proj = new THREE.Vector3(); const _axisX = new THREE.Vector3(1, 0, 0); const _axisY = new THREE.Vector3(0, 1, 0);
        
        function findNextEclipseTime(startTime, isLunar) {
            let t = startTime + 2; const dt = 0.1; 
            for(let i=0; i<36500; i++) { 
                t += dt;
                const eAng = (t / 365.25) * Math.PI * 2; _ePos.set(Math.cos(eAng)*DIST_EARTH, 0, -Math.sin(eAng)*DIST_EARTH);
                const nodeAngle = -(t / 6793) * Math.PI * 2; const mAng = (t / 27.32) * Math.PI * 2;
                _mLocalPos.set(Math.cos(mAng)*DIST_MOON, 0, -Math.sin(mAng)*DIST_MOON);
                _mLocalPos.applyAxisAngle(_axisX, INCLINATION); _mLocalPos.applyAxisAngle(_axisY, nodeAngle); _mWorldPos.addVectors(_ePos, _mLocalPos);
                
                if (isLunar) {
                    _dirS2E.copy(_ePos).normalize(); _dirE2M.subVectors(_mWorldPos, _ePos); const dot = _dirE2M.dot(_dirS2E);
                    if (dot > 0) { _proj.copy(_dirS2E).multiplyScalar(dot); const perpDist = _dirE2M.subVectors(_dirE2M, _proj).length();
                        if (perpDist < R_EARTH * 0.8) return t - 0.8; }
                } else {
                    _dirS2M.copy(_mWorldPos).normalize(); _dirM2E.subVectors(_ePos, _mWorldPos); const dot = _dirM2E.dot(_dirS2M);
                    if (dot > 0) { _proj.copy(_dirS2M).multiplyScalar(dot); const perpDist = _dirM2E.subVectors(_dirM2E, _proj).length();
                        if (perpDist < R_EARTH * 0.4) return t - 0.8; }
                }
            }
            return startTime; 
        }

        const setObservationMode = (speed, trackTarget, customOffset=null) => {
            timeSpeed = speed; speedSlider.value = speed; speedDisplay.innerText = `${speed.toFixed(2)} 天/秒`;
            isPlaying = true; document.getElementById('play-btn').innerHTML = '⏸'; focusCameraOn(trackTarget, customOffset);
        };

        document.getElementById('btn-solar-eclipse').addEventListener('click', () => { 
            timeDays = findNextEclipseTime(timeDays, false);
            const eAng = (timeDays / 365.25) * Math.PI * 2; const ePos = new THREE.Vector3(Math.cos(eAng)*DIST_EARTH, 0, -Math.sin(eAng)*DIST_EARTH);
            const camOffset = ePos.clone().normalize().multiplyScalar(-25).add(new THREE.Vector3(0, 6, 8));
            timeSpeed = 0.003; speedSlider.value = 0.003; speedDisplay.innerText = `0.00 天/秒`; isPlaying = true;
            focusCameraOn('earth', camOffset); 
            updateTooltip("🌑 时空跃迁：寻觅日食", `已穿越时空寻找下一次日食！请盯着地球，等待月球的巨大物理阴影跨越海面！`, "🚀");
        });
        document.getElementById('btn-lunar-eclipse').addEventListener('click', () => { 
            timeDays = findNextEclipseTime(timeDays, true);
            const eAng = (timeDays / 365.25) * Math.PI * 2; const ePos = new THREE.Vector3(Math.cos(eAng)*DIST_EARTH, 0, -Math.sin(eAng)*DIST_EARTH);
            const mAng = (timeDays / 27.32) * Math.PI * 2; const mLocalPos = new THREE.Vector3(Math.cos(mAng)*DIST_MOON, 0, -Math.sin(mAng)*DIST_MOON);
            mLocalPos.applyAxisAngle(_axisX, INCLINATION); mLocalPos.applyAxisAngle(_axisY, -(timeDays / 6793) * Math.PI * 2);
            const mWorldPos = ePos.clone().add(mLocalPos);
            const camOffset = mWorldPos.clone().sub(ePos).normalize().multiplyScalar(-10).add(new THREE.Vector3(2, 3, 0));
            timeSpeed = 0.003; speedSlider.value = 0.003; speedDisplay.innerText = `0.00 天/秒`; isPlaying = true;
            focusCameraOn('moon', camOffset); 
            updateTooltip("🌕 时空跃迁：寻觅血月", `已在时光中拦截下一次完美交会！地球巨大阴影将从边缘切入吞没月面。`, "🚀");
        });
        
        document.getElementById('btn-moon-phases').addEventListener('click', function() { 
            focusCameraOn('moon'); 
            isTrackingPhase = true; 
            
            customCamDist = camera.position.distanceTo(controls.target) || 8;
            controls.enabled = false; 
            
            timeSpeed = 1.0; speedSlider.value = 1.0; speedDisplay.innerText = `1.00 天/秒`;
            isPlaying = true; document.getElementById('play-btn').innerHTML = '⏸';
            this.classList.add('active-mode');
            updateTooltip("🌖 演示月相盈亏周期", "视野已强制绝对锁定为【背靠地球，直视月球】的连线！（可利用滚轮缩放）。你会看到极其完美的月相渐变！", "🔭");
        });

        let polarViewMode = 0; 
        document.getElementById('btn-polar-day-night').addEventListener('click', () => {
            polarViewMode = (polarViewMode + 1) % 3; const btnSpan = document.getElementById('polar-status');
            if (polarViewMode === 1) { 
                if(!showPolars) document.getElementById('btn-toggle-polars').click(); if(!showTerminator) document.getElementById('btn-toggle-terminator').click();
                if(!isEarthTilted) document.getElementById('btn-toggle-tilt').click(); if(!isShowSunlight) document.getElementById('btn-sunlight').click();
                timeDays = 365.25 * 0.5; timeSpeed = 0.05; speedSlider.value = 0.05; speedDisplay.innerText = `0.05 天/秒`; isPlaying = true;
                focusCameraOn('earth', new THREE.Vector3(12, 27.5, 0)); 
                btnSpan.innerText = "北极俯视"; btnSpan.className = "bg-blue-600 text-white px-1 rounded text-[10px]";
            } else if (polarViewMode === 2) { 
                if(!showPolars) document.getElementById('btn-toggle-polars').click(); if(!showTerminator) document.getElementById('btn-toggle-terminator').click();
                if(!isEarthTilted) document.getElementById('btn-toggle-tilt').click();
                timeDays = 0; timeSpeed = 0.05; speedSlider.value = 0.05; speedDisplay.innerText = `0.05 天/秒`; isPlaying = true;
                focusCameraOn('earth', new THREE.Vector3(-12, -27.5, 0)); 
                btnSpan.innerText = "南极俯视"; btnSpan.className = "bg-red-600 text-white px-1 rounded text-[10px]";
            } else { 
                timeSpeed = 2.0; speedSlider.value = 2.0; speedDisplay.innerText = `2.00 天/秒`;
                focusCameraOn('earth'); btnSpan.innerText = "点击切换俯视"; btnSpan.className = "bg-cyan-950 px-1 rounded text-[10px]";
            }
        });

        const setRefFrame = (frame) => {
            if(refFrame === frame) return; refFrame = frame; 
            sunTrailPoints.length = 0; sunTrailLine.geometry.setFromPoints([]);
            planetsData.forEach(item => { item.trailPoints.length = 0; item.trailLine.geometry.setFromPoints([]); item.baseOrbit.visible = (frame === 'heliocentric'); });
            const btnHelio = document.getElementById('btn-heliocentric'), btnGeo = document.getElementById('btn-geocentric');
            if(frame === 'heliocentric') {
                btnHelio.className = 'epic-btn active-mode text-white font-bold py-1.5 px-2 rounded-lg text-xs cursor-pointer'; btnGeo.className = 'bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white font-bold py-1.5 px-2 rounded-lg text-xs transition cursor-pointer';
                document.getElementById('frame-status').innerText = '太阳系全景 (日心说)'; earthOrbit.visible = true; focusCameraOn('system');
            } else {
                btnGeo.className = 'epic-btn active-mode text-white font-bold py-1.5 px-2 rounded-lg text-xs cursor-pointer'; btnHelio.className = 'bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white font-bold py-1.5 px-2 rounded-lg text-xs transition cursor-pointer';
                document.getElementById('frame-status').innerText = '人类视角 (地心说)'; earthOrbit.visible = false; focusCameraOn('earth', new THREE.Vector3(0, 400, 800));
            }
        };
        document.getElementById('btn-heliocentric').addEventListener('click', () => setRefFrame('heliocentric'));
        document.getElementById('btn-geocentric').addEventListener('click', () => setRefFrame('geocentric'));

        focusCameraOn('system'); updateTooltip("科学实验教具完美升级", "日晷物理投影与环形山系统已100%严谨重构！更集成了高级智能语音互动（支持随时打断），点击右上角召唤AI小助教吧！", "🌌");

        let lastDateString = ""; let lastPhaseString = "";
        const solarTerms = ["冬至", "小寒", "大寒", "立春", "雨水", "惊蛰", "春分", "清明", "谷雨", "立夏", "小满", "芒种", "夏至", "小暑", "大暑", "立秋", "处暑", "白露", "秋分", "寒露", "霜降", "立冬", "小雪", "大雪"];
        
        const _animEPos = new THREE.Vector3(); const _animSunPos = new THREE.Vector3();
        const _animMoonPos = new THREE.Vector3(); const _animStoEDir = new THREE.Vector3();
        const _animEtoMDir = new THREE.Vector3(); const _animProj = new THREE.Vector3();
        const _animLocalSun = new THREE.Vector3(); const _animCityPos = new THREE.Vector3();
        const _animCityNormal = new THREE.Vector3(); const _animCamDir = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            sunShaderMaterial.uniforms.time.value += delta;
            innerGlow.material.rotation += delta * 0.1; outerGlow.material.rotation -= delta * 0.05;

            if (controls.enabled) controls.update(); 

            if (isPlaying) {
                timeDays += timeSpeed * delta; 
                
                if (Math.abs(earthTiltGroup.rotation.z - targetTilt) > 0.001) earthTiltGroup.rotation.z += (targetTilt - earthTiltGroup.rotation.z) * 0.1; else earthTiltGroup.rotation.z = targetTilt;

                const eAng = (timeDays / 365.25) * Math.PI * 2;
                const baseDate = new Date(2023, 11, 22);
                const currentDate = new Date(baseDate.getTime() + timeDays * 24 * 60 * 60 * 1000);
                const month = currentDate.getMonth() + 1; const date = currentDate.getDate();
                const degree = ((timeDays / 365.25) * 360 % 360 + 360) % 360;
                const termIndex = Math.floor(degree / 15);
                const newDateString = `${month}月${date}日 [${solarTerms[termIndex]}]`;
                if (newDateString !== lastDateString) { document.getElementById('date-status').innerText = newDateString; lastDateString = newDateString; }

                _animEPos.set(Math.cos(eAng)*DIST_EARTH, 0, -Math.sin(eAng)*DIST_EARTH);
                if (refFrame === 'heliocentric') { sunGroup.position.set(0,0,0); earthPosGroup.position.copy(_animEPos); } 
                else { earthPosGroup.position.set(0,0,0); sunGroup.position.copy(_animEPos).negate(); }

                sunLight.position.copy(sunGroup.position);
                shadowLight.position.copy(sunGroup.position); shadowLight.target.position.copy(earthPosGroup.position); shadowLight.target.updateMatrixWorld();
                
                if (showTerminator) terminatorMesh.lookAt(sunGroup.position);

                lunarNodeGroup.rotation.y = -(timeDays / 6793) * Math.PI * 2;
                const mAng = (timeDays / 27.32) * Math.PI * 2;
                moonMesh.position.set(Math.cos(mAng)*DIST_MOON, 0, -Math.sin(mAng)*DIST_MOON);
                moonMesh.rotation.y = mAng + Math.PI / 2;
                
                _animSunPos.copy(sunGroup.position); moonMesh.getWorldPosition(_animMoonPos);
                _animStoEDir.subVectors(earthPosGroup.position, _animSunPos).normalize();
                _animEtoMDir.subVectors(_animMoonPos, earthPosGroup.position);
                const dotProduct = _animEtoMDir.dot(_animStoEDir);
                
                if (dotProduct > 0) {
                    _animProj.copy(_animStoEDir).multiplyScalar(dotProduct); 
                    const perpDist = _animEtoMDir.subVectors(_animEtoMDir, _animProj).length();
                    if (perpDist < R_EARTH * 1.2) { moonMat.emissive.setHex(0x660505); moonMat.emissiveIntensity = 0.85 * (1.0 - Math.min(perpDist / (R_EARTH * 1.2), 1.0)); } 
                    else { moonMat.emissive.setHex(0x000000); moonMat.emissiveIntensity = 0; }
                } else { moonMat.emissive.setHex(0x000000); moonMat.emissiveIntensity = 0; }

                _animStoEDir.subVectors(sunGroup.position, earthPosGroup.position).setY(0).normalize();
                _animEtoMDir.subVectors(_animMoonPos, earthPosGroup.position).setY(0).normalize();
                let phaseAngle = Math.atan2(_animStoEDir.clone().cross(_animEtoMDir).y, _animStoEDir.dot(_animEtoMDir));
                if (phaseAngle < 0) phaseAngle += Math.PI * 2;
                const phaseDegree = phaseAngle * 180 / Math.PI;

                let phaseName = ""; let phaseIcon = "";
                if (phaseDegree < 22.5 || phaseDegree >= 337.5) { phaseName = "新月(朔)"; phaseIcon = "🌑"; }
                else if (phaseDegree < 67.5) { phaseName = "蛾眉月"; phaseIcon = "🌒"; }
                else if (phaseDegree < 112.5) { phaseName = "上弦月"; phaseIcon = "🌓"; }
                else if (phaseDegree < 157.5) { phaseName = "盈凸月"; phaseIcon = "🌔"; }
                else if (phaseDegree < 202.5) { phaseName = "满月(望)"; phaseIcon = "🌕"; }
                else if (phaseDegree < 247.5) { phaseName = "亏凸月"; phaseIcon = "🌖"; }
                else if (phaseDegree < 292.5) { phaseName = "下弦月"; phaseIcon = "🌗"; }
                else { phaseName = "残月"; phaseIcon = "🌘"; }

                const newPhaseString = `${phaseIcon} ${phaseName}`;
                if (newPhaseString !== lastPhaseString) { document.getElementById('moon-phase-status').innerText = newPhaseString; lastPhaseString = newPhaseString; }

                earthMesh.rotation.y = timeDays * Math.PI * 2 + eAng; cloudMesh.rotation.y = timeDays * Math.PI * 2 * 1.03 + eAng;

                if (isShowSubsolar) {
                    _animLocalSun.copy(earthMesh.worldToLocal(sunGroup.position.clone())).normalize();
                    subsolarMarker.position.copy(_animLocalSun).multiplyScalar(R_EARTH * 1.02);
                    heatmapMaterial.uniforms.localSunDir.value.copy(_animLocalSun);
                }

                if (isSunriseMode) {
                    _animStoEDir.subVectors(sunGroup.position, earthPosGroup.position).normalize();
                    cityMarkers.forEach(c => {
                        c.mesh.getWorldPosition(_animCityPos);
                        _animCityNormal.subVectors(_animCityPos, earthPosGroup.position).normalize();
                        _animCamDir.subVectors(camera.position, _animCityPos).normalize();
                        
                        if (_animCityNormal.dot(_animCamDir) < -0.1) { c.label.style.opacity = '0'; } 
                        else {
                            const screenPos = _animCityPos.project(camera);
                            const x = (screenPos.x * .5 + .5) * window.innerWidth;
                            const y = (screenPos.y * -.5 + .5) * window.innerHeight;
                            c.label.style.transform = `translate(-50%, -150%) translate(${x}px, ${y}px)`;
                            c.label.style.opacity = '1';
                        }
                        const dot = _animCityNormal.dot(_animStoEDir);
                        if (c.lastDot <= 0 && dot > 0 && timeSpeed > 0 && timeSpeed < 5) {
                            spawnToast(`☀️ 晨昏线跨越：【${c.config.name}】迎来日出！`, c.config.color);
                        }
                        c.lastDot = dot;
                    });
                }

                if(isSundialMode) {
                    sunGroup.getWorldPosition(_animSunPos);
                    sundialGroup.worldToLocal(_animLocalSun.copy(_animSunPos));
                    
                    if(_animLocalSun.y > 0) { 
                        shadowPivot.children[0].visible = true; 
                        const gnomonHeight = 0.25;
                        const sx = _animLocalSun.x; const sz = _animLocalSun.z; 
                        const sunDistHorizontal = Math.sqrt(sx*sx + sz*sz);
                        
                        let shadowLen = (gnomonHeight * sunDistHorizontal) / _animLocalSun.y;
                        shadowLen = Math.min(shadowLen, 1.5); 
                        
                        shadowPivot.scale.set(1, 1, shadowLen);
                        shadowPivot.rotation.y = Math.atan2(-sx, -sz);
                    } else {
                        shadowPivot.children[0].visible = false;
                    }
                }

                if (isPlanetsEnabled) {
                    planetsData.forEach(item => {
                        const angle = (timeDays / item.config.period) * Math.PI * 2;
                        item.mesh.position.set(Math.cos(angle) * item.config.dist, 0, -Math.sin(angle) * item.config.dist); item.mesh.rotation.y += 0.01; 
                        item.mesh.getWorldPosition(_animCityPos); 
                        if (item.trailPoints.length === 0 || item.trailPoints[item.trailPoints.length-1].distanceTo(_animCityPos) > 3) {
                            item.trailPoints.push(_animCityPos.clone()); if (item.trailPoints.length > 1500) item.trailPoints.shift(); item.trailLine.geometry.setFromPoints(item.trailPoints);
                        }
                    });
                }
            }

            const currentTargetWorldPos = getTargetWorldPosition(currentTrackingTarget);
            
            if (isCameraTransitioning) {
                if (isTrackingPhase) {
                    moonMesh.getWorldPosition(_animMoonPos);
                    _animCamDir.subVectors(earthPosGroup.position, _animMoonPos).normalize();
                    targetEndTargetPos.copy(_animMoonPos); targetEndCamPos.copy(_animMoonPos).add(_animCamDir.multiplyScalar(12)); 
                }
                
                if (currentTrackingTarget === 'sundial') {
                    sundialGroup.getWorldPosition(_animCityPos);
                    const localNorth = new THREE.Vector3(0, 1, 0).applyQuaternion(earthTiltGroup.quaternion).normalize();
                    const up = _animCityPos.clone().sub(earthPosGroup.position).normalize();
                    const east = new THREE.Vector3().crossVectors(localNorth, up).normalize();
                    const south = new THREE.Vector3().crossVectors(up, east).normalize();
                    
                    targetEndTargetPos.copy(_animCityPos);
                    targetEndCamPos.copy(_animCityPos).add(up.multiplyScalar(1)).add(south.multiplyScalar(1.7));
                }

                transitionProgress += delta * 1.5; 
                if (transitionProgress >= 1) { 
                    transitionProgress = 1; 
                    isCameraTransitioning = false; 
                    lastTargetWorldPos.copy(currentTargetWorldPos); 
                    
                    if (!isTrackingPhase && currentTrackingTarget !== 'sundial') {
                        controls.enabled = true;
                    }
                }
                
                const easeOutQuart = 1 - Math.pow(1 - transitionProgress, 4);
                const dynamicEndCamPos = targetEndCamPos.clone().add(currentTargetWorldPos.clone().sub(targetEndTargetPos));
                camera.position.lerpVectors(transitionStartCamPos, dynamicEndCamPos, easeOutQuart);
                
                camera.lookAt(currentTargetWorldPos);
                controls.target.copy(currentTargetWorldPos);
                
            } else {
                
                if (isTrackingPhase) {
                    moonMesh.getWorldPosition(_animMoonPos);
                    _animCamDir.subVectors(earthPosGroup.position, _animMoonPos).normalize();
                    
                    camera.position.copy(_animMoonPos).add(_animCamDir.multiplyScalar(customCamDist)); 
                    camera.lookAt(_animMoonPos);
                    
                } else if (currentTrackingTarget === 'sundial') {
                    sundialGroup.getWorldPosition(_animCityPos);
                    
                    const localNorth = new THREE.Vector3(0, 1, 0).applyQuaternion(earthTiltGroup.quaternion).normalize();
                    const up = _animCityPos.clone().sub(earthPosGroup.position).normalize();
                    const east = new THREE.Vector3().crossVectors(localNorth, up).normalize();
                    const south = new THREE.Vector3().crossVectors(up, east).normalize();
                    
                    const camPos = _animCityPos.clone().add(up.multiplyScalar(customCamDist * 0.5)).add(south.multiplyScalar(customCamDist * 0.8)).add(east.multiplyScalar(customCamDist * 0.2));
                    
                    camera.position.copy(camPos);
                    camera.up.copy(localNorth); 
                    camera.lookAt(_animCityPos);
                    
                } else {
                    camera.up.set(0, 1, 0); 
                    const posDelta = currentTargetWorldPos.clone().sub(lastTargetWorldPos);
                    controls.target.add(posDelta); camera.position.add(posDelta); lastTargetWorldPos.copy(currentTargetWorldPos);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
